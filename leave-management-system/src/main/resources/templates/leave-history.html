<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Leave History</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div class="layout"><aside class="sidebar"><div class="brand"><span class="brand-mark">✦</span> TeamHub</div><nav><a th:href="@{/employee/dashboard}">▦ Dashboard</a><a th:href="@{/employee/apply}">＋ Apply Leave</a><a class="active" th:href="@{/employee/history}">▤ Leave History</a></nav><div class="sidebar-bottom"><strong th:text="${employee.fullName}">Employee</strong><form th:action="@{/logout}" method="post"><button class="logout">↪ Sign out</button></form></div></aside>
<main class="main"><header class="topbar"><div><span class="eyebrow">EMPLOYEE PORTAL</span><h1>Leave history</h1><p class="muted">All your submitted leave requests.</p></div><a class="btn primary" th:href="@{/employee/apply}">＋ Apply leave</a></header>
<section class="panel"><div class="table-wrap"><table><thead><tr><th>Applied on</th><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Reason</th><th>Status</th><th>Manager comment</th></tr></thead><tbody>
<tr th:each="r : ${requests}"><td th:text="${#temporals.format(r.appliedAt,'dd MMM yyyy')}"></td><td th:text="${r.leaveType}"></td><td th:text="${r.startDate}"></td><td th:text="${r.endDate}"></td><td th:text="${r.days}"></td><td th:text="${r.reason}"></td><td><span class="status" th:classappend="${#strings.toLowerCase(r.status)}" th:text="${r.status}"></span></td><td th:text="${r.managerComment ?: '—'}"></td></tr>
<tr th:if="${#lists.isEmpty(requests)}"><td colspan="8" class="empty">No leave history found.</td></tr></tbody></table></div></section></main></div></body></html>
