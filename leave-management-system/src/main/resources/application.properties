spring.application.name=leave-management-system
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/leave_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:${DB_USERNAME}}
spring.datasource.password=${DB_PASSWORD:${DB_PASSWORD}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
